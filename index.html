<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Công Việc - Phân Hiệu UFM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Thanh Navigation -->
    <div id="navbar-container"></div>

    <!-- Khu vực nội dung chính -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">
        <!-- Vùng hiển thị thông báo/lỗi -->
        <div id="alert-container"></div>

        <!-- Vùng hiển thị động các View (Đăng nhập / Danh sách công việc / Thống kê) -->
        <div id="app-content">
            <div class="flex items-center justify-center py-20 text-slate-400">
                <i class="fa-solid font-circle-notch animate-spin text-3xl mr-3"></i>
                <span>Đang tải hệ thống...</span>
            </div>
        </div>
    </main>

    <!-- Modal Form (Dùng cho Thêm / Sửa công việc) -->
    <div id="modal-container"></div>

    <!-- Entrypoint chính của JavaScript -->
    <script type="module" src="/js/main.js"></script>
</body>
</html>
